<!doctype html>
     <html>
                       <head>
                       <title>Blink animation</title>
                       </head>
     <style>
                .b{
               color:blue;
             font-size:30px;
            text-align:center;
         animation:blink 1s infinite;
                    }
        @keyframes blink{
                     0%{ 
                      opacity:1;
                           }
                    50%{
                         opacity:0;
                        } 
                      100%{
                       opacity:1;
                                }

                           }
      </style>
     <body> 
               <p class="b">Learn web pages with Kapil sir</p>

     </body>
     </html>
